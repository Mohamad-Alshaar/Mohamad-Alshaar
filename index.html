<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Calculator</title>
    <link rel="stylesheet" href="stylee.css">
</head>
<body>

    <div class="card">
        <h1>Welcome to Calc Web</h1>
        
        <div class="input-group">
            <label for="first">Enter Your First Num:</label>
            <input type="number" id="first" placeholder="0">
        </div>

        <div class="input-group">
            <label for="op">Enter Your Operation:</label>
            <select id="op">
                <option value="-">Minus (-)</option>
                <option value="+">Add (+)</option>
            </select>
        </div>

        <div class="input-group">
            <label for="sec">Enter Your Sec Num:</label>
            <input type="number" id="sec" placeholder="0">
        </div>

        <button type="button" id="submit">Submit</button>

        <div id="result">النتيجة ستظهر هنا...</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
